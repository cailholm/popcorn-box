{% extends 'base.html' %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="popcorn-card fade-in" style="max-width: 400px; margin: 2rem auto;">
        <h1 style="text-align: center;">
            <i class="fas fa-user-plus popcorn-icon popcorn-icon-large bounce"></i>
            {{ title }}
        </h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">{% trans 'Username:' %}</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="email">{% trans 'Email:' %}</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">{% trans 'Password:' %}</label>
                <input type="password" id="password" name="password" class="form-control" required minlength="6">
            </div>
            <div class="form-group">
                <label for="password_confirm">{% trans 'Confirm Password:' %}</label>
                <input type="password" id="password_confirm" name="password_confirm" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-user-plus popcorn-icon"></i>
                {% trans 'Create Account' %}
            </button>
        </form>
        <div class="auth-link" style="text-align: center; margin-top: 1.5rem;">
            <p>{% trans 'Already have an account?' %} <a href="{% url 'login' %}">{% trans 'Sign In' %}</a></p>
        </div>
    </div>
{% endblock %}
